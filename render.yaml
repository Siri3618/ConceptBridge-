services:
  - type: web
    name: conceptbridge-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w @conceptbridge/api
    startCommand: npm run start -w @conceptbridge/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
